# Start: docker compose up -d --build   (vorher .env aus .env.example anlegen)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data        # Datenbank + hochgeladene Dokumente – regelmäßig sichern!
  caddy:                        # HTTPS-Zertifikat automatisch über Let's Encrypt
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  caddy_data: {}
